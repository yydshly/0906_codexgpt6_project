name: Deploy oil studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
        env:
          DEPLOY_BASE_PATH: /0906_codexgpt6_project/
      - name: Verify painting state and undo
        run: npm run test:engine
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
